<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG Lab 知识库</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">RAG LAB · 知识库检索</p>
      <h1>找到可核对的知识依据</h1>
      <p class="scope">面向已收录资料的检索结果；每条结果都附带章节与页码。</p>
      <form id="search-form">
        <label for="query">提出问题</label>
        <div class="query-row">
          <input id="query" name="query" maxlength="500" required placeholder="例如：什么是网络协议？" autocomplete="off">
          <button type="submit">搜索</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="results" aria-live="polite"></section>
    </main>
    <template id="result-template">
      <article class="result-card">
        <p class="content"></p>
        <p class="citation"></p>
      </article>
    </template>
    <script src="/static/app.js" defer></script>
  </body>
</html>
