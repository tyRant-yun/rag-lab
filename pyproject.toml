[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Local knowledge-base product for source-grounded RAG workflows."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "jieba>=0.42.1,<1",
    "rank-bm25>=0.2.2,<0.3",
]

[project.scripts]
normalize-docling = "rag_lab.normalization.cli:main"
chunk-normalized = "rag_lab.chunking.cli:main"
search-bm25 = "rag_lab.retrieval.bm25.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
