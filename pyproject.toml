[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Local knowledge-base product for source-grounded RAG workflows."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "jieba>=0.42.1,<1",
    "rank-bm25>=0.2.2,<0.3",
    "httpx>=0.27,<1",
    "ollama>=0.6.2,<0.7",
    "qdrant-client>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # test_api.py requires FastAPI/uvicorn, so dev must cover the api extra.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
conversion = [
    "docling>=2,<3",
    "PyMuPDF>=1.28,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
normalize-docling = "rag_lab.normalization.cli:main"
chunk-normalized = "rag_lab.chunking.cli:main"
search-bm25 = "rag_lab.retrieval.bm25.cli:main"
search-dense = "rag_lab.retrieval.dense.cli:main"
search-hybrid = "rag_lab.retrieval.hybrid.cli:main"
search-rerank = "rag_lab.retrieval.rerank.cli:main"
evaluate-bm25 = "rag_lab.evaluation.bm25_cli:main"
evaluate-dense = "rag_lab.evaluation.dense_cli:main"
evaluate-hybrid = "rag_lab.evaluation.hybrid_cli:main"
evaluate-rerank = "rag_lab.evaluation.rerank_cli:main"
embed-chunks = "rag_lab.embeddings.cli:main"
index-qdrant = "rag_lab.vector_store.cli:main"
serve-api = "rag_lab.api.cli:main"
search-tool-schema = "rag_lab.tools.cli:schema_main"
execute-search-tool = "rag_lab.tools.cli:execute_main"
audit-artifacts = "rag_lab.quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag_lab.api" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
