[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-normalizer"
version = "0.1.0"
description = "Normalize Docling JSON into ordered, source-grounded blocks."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.scripts]
normalize-docling = "knowledge_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
